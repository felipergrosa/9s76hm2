version: "3.8"
services:
  backend:
    image: felipergrosa/9s76hm2-backend:latest
    build:
      context: ./backend
      args:
        BUILD_DATE: ${BUILD_DATE}
        GIT_COMMIT: ${GIT_COMMIT}
        BACKEND_VERSION: ${BACKEND_VERSION}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: whaticket-backend
    restart: always
    # postgres/redis sao externos (rede nobreluminarias) — auto-migrate.sh
    # ja aguarda o banco ficar pronto antes de migrar e subir o server
    environment:
      NODE_ENV: production
      # Heap limit 1GB (uso real ~268MB, container limit 3GB)
      NODE_OPTIONS: "--max-old-space-size=1024"
      DB_DIALECT: postgres
      DB_HOST: postgres  # Serviço externo na rede nobreluminarias
      DB_PORT: 5432
      DB_NAME: whaticket
      DB_USER: postgres
      DB_PASS: efe487b6a861100fb704ad9f5c160cb8
      TZ: America/Sao_Paulo
      FRONTEND_URL: ${FRONTEND_URL:-https://chats.nobreluminarias.com.br}
      BACKEND_URL: ${BACKEND_URL:-https://chatsapi.nobreluminarias.com.br}
      REDIS_URI: redis://redis:6379/0  # Serviço externo na rede nobreluminarias
      REDIS_URI_ACK: redis://redis:6379/0
      BULL_USER: admin
      BULL_PASS: admin
      JWT_SECRET: supersecret
      JWT_REFRESH_SECRET: supersecretrefresh
      SESSIONS_DRIVER: fs
      SESSIONS_DIR: private/sessions
      # Chave AES-256-GCM p/ cofre (cookies IG, token Apify). Gerar:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Definir no .env ao lado do compose. Sem ela, cofre falha por design.
      DATA_KEY: ${DATA_KEY:-}
      # Brasil.io — busca textual de CNPJ no enriquecimento cruzado
      BRASILIO_TOKEN: ${BRASILIO_TOKEN:-}
      # Configurações de validação WhatsApp (REVERTIDO AO ORIGINAL)
      CONTACT_FILTER_ASYNC_VALIDATION: "false"
      CONTACT_VALIDATION_BATCH_SIZE: "50"
      CONTACT_FILTER_DIRECT_SQL: "false"
      CONTACT_FILTER_VALIDATE_WHATSAPP: "true"
      CONTACT_FILTER_INSERT_CHUNK_SIZE: "1000"
      # WhatsApp Business API (Meta) - Configurações Globais
      WABA_WEBHOOK_VERIFY_TOKEN: ${WABA_WEBHOOK_VERIFY_TOKEN:-602536nblumi2025}
      WABA_API_VERSION: ${WABA_API_VERSION:-v18.0}
      # Sidecar Google Maps Scraper (rede interna, sem porta publicada)
      GMAPS_SCRAPER_URL: http://gmaps-scraper:8080
    networks:
      - nobreluminarias
    ports:
      - "8080:8080"
    volumes:
      # Persistir apenas uploads e arquivos públicos, sem sobrescrever a aplicação
      - backend-public:/app/public
      # Persistir arquivos privados (inclui sessões do Baileys)
      - backend-private:/app/private

  frontend:
    image: felipergrosa/9s76hm2-frontend:latest
    build: ./frontend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: whaticket-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - nobreluminarias
    volumes:
      - ./frontend:/app

  # Sidecar opcional: Google Maps Scraper (gosom/google-maps-scraper, MIT)
  # API REST interna em :8080 — NÃO publicar porta (conflito com backend 8080 no host)
  gmaps-scraper:
    image: gosom/google-maps-scraper:v1.17.4
    container_name: whaticket-gmaps-scraper
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata"]
    networks:
      - nobreluminarias
    volumes:
      - gmaps-playwright-cache:/opt
      - gmaps-data:/gmapsdata

  # Watchtower: auto-deploy — monitora DockerHub e recria containers quando
  # a imagem :latest muda (apos push na main -> Actions build -> pull aqui).
  # --label-enable: so toca containers marcados (backend/frontend); demais
  # containers do host (postgres, redis, outros projetos) ficam intactos.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: whaticket-watchtower
    restart: unless-stopped
    command: ["--label-enable", "--cleanup", "--interval", "300", "--rolling-restart"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Credenciais do Docker Hub (caso as imagens fiquem privadas)
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/config.json:ro
    networks:
      - nobreluminarias

networks:
  nobreluminarias:
    external: true

volumes:
  # Volumes para backend (uploads e sessões)
  backend-public:
  backend-private:
  # Volumes do sidecar Google Maps Scraper
  gmaps-playwright-cache:  # cache do browser/playwright do scraper
  gmaps-data:              # jobs e CSVs gerados pelo scraper
  # IMPORTANTE: Postgres e Redis são serviços EXTERNOS
  # Se precisar incluí-los no compose, use estes volumes:
  # whaticket_postgres_data  # Dados do banco (361 tickets, 395 contatos)
  # whaticket_redis-data     # Cache e sessões Redis
