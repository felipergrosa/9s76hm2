name: Build, Push and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-backend2.yml'
  workflow_dispatch:

concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runner self-hosted na VPS (stack ci-runner) — gratis em repo privado.
    # O runner tem docker.sock: builda, publica e atualiza o service do swarm.
    runs-on: [self-hosted, vps]
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute backend version label
        id: vcalc
        run: |
          BASE=$(node -p -e "require('./backend/package.json').version")
          PREFIX=$(node -e "const v=process.argv[1];const m=v.match(/^(.*?)(?:v-\d+)?$/);process.stdout.write(m?m[1]:v)" "$BASE")
          echo "version_label=${PREFIX}v-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          # docker build classico: manifest Docker v2 nativo (compativel com o swarm)
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg BACKEND_VERSION=${{ steps.vcalc.outputs.version_label }} \
            -t felipergrosa/9s76hm2-backend:latest \
            -t felipergrosa/9s76hm2-backend:${{ github.sha }} \
            -t felipergrosa/9s76hm2-backend:v${{ steps.vcalc.outputs.version_label }} \
            ./backend
          docker push felipergrosa/9s76hm2-backend:latest
          docker push felipergrosa/9s76hm2-backend:${{ github.sha }}
          docker push felipergrosa/9s76hm2-backend:v${{ steps.vcalc.outputs.version_label }}

      - name: Deploy no swarm
        run: |
          # Atualiza o service da stack whaticket com a nova :latest
          docker service update --with-registry-auth --force \
            --image felipergrosa/9s76hm2-backend:latest \
            whaticket_whaticketback

      - name: Cleanup docker cache
        if: always()
        run: docker system prune -af --filter "until=24h" || true
