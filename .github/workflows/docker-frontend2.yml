name: Build, Push and Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend2.yml'
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runner self-hosted na VPS (stack ci-runner) — gratis em repo privado.
    # O runner tem docker.sock: builda, publica e atualiza o service do swarm.
    runs-on: [self-hosted, vps]
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute frontend version label
        id: vcalc
        run: |
          BASE=$(node -p -e "require('./frontend/package.json').version")
          PREFIX=$(node -e "const v=process.argv[1];const m=v.match(/^(.*?)(?:v-\d+)?$/);process.stdout.write(m?m[1]:v)" "$BASE")
          echo "version_label=${PREFIX}v-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg REACT_APP_FRONTEND_VERSION=${{ steps.vcalc.outputs.version_label }} \
            -t felipergrosa/9s76hm2-frontend:latest \
            -t felipergrosa/9s76hm2-frontend:${{ github.sha }} \
            -t felipergrosa/9s76hm2-frontend:v${{ steps.vcalc.outputs.version_label }} \
            ./frontend
          docker push felipergrosa/9s76hm2-frontend:latest
          docker push felipergrosa/9s76hm2-frontend:${{ github.sha }}
          docker push felipergrosa/9s76hm2-frontend:v${{ steps.vcalc.outputs.version_label }}

      - name: Deploy no swarm
        run: |
          docker service update --with-registry-auth --force \
            --image felipergrosa/9s76hm2-frontend:latest \
            whaticket_whaticketfront

      - name: Cleanup docker cache
        if: always()
        run: docker system prune -af --filter "until=24h" || true
